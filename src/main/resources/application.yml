spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dsaquestionmanager
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

server:
  port: 85

logging:
  level:
    com.dsa.manager: DEBUG
    org.hibernate.SQL: DEBUG